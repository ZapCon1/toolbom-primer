[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "toolbom-reader"
version = "0.1.0"
description = "Read Mastercam (.tooldb) and Fusion (.tools) tool libraries as bill-of-materials rows."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zappettini Consulting" }]
requires-python = ">=3.12"
dependencies = []
keywords = ["mastercam", "fusion 360", "tool library", "bill of materials", "cnc", "cam"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Manufacturing",
    "Typing :: Typed",
]

[project.urls]
"ToolBOM (hosted app)" = "https://toolbom.zappettiniconsulting.com"

[project.scripts]
toolbom-reader = "toolbom_reader.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=6,<8",
    "mypy>=1.13,<2",
    "ruff>=0.8,<1",
    "pip-audit>=2.7,<3",
    "jsonschema>=4.23,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/toolbom_reader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["toolbom_reader"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["jsonschema"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Parametrized case tables are kept one case per line (`# fmt: skip`).
"tests/*" = ["E501"]
